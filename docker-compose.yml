# Local stack: API + web. VERIFIED 2026-11-04 (Docker 27.5.1): both images build, API healthy, all pages 200 via the web proxy.
#   docker compose up --build            -> serves the bundled real-data sample (3,785 records, smoke-scale models)
#   CIVICPULSE_DATA_DIR=/app/data docker compose up --build
#                                         -> serves your local full snapshot from ./data (read-only)
services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      CIVICPULSE_DATA_DIR: ${CIVICPULSE_DATA_DIR:-/app/sample-data}
      CIVICPULSE_API_CORS_ORIGINS: http://localhost:3000
      # AI analyst: the MCP server runs as a stdio subprocess of the API (never network-exposed).
      # Default is the deterministic fake provider; a real provider needs a server-side key in the environment.
      CIVICPULSE_LLM_PROVIDER: ${CIVICPULSE_LLM_PROVIDER:-fake}
      CIVICPULSE_LLM_MODEL: ${CIVICPULSE_LLM_MODEL:-deterministic-fake-v1}
      CIVICPULSE_OPENAI_API_KEY: ${CIVICPULSE_OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data:ro
    # Not published to the host: the browser reaches the API only through the web service.
    expose:
      - "8000"
  web:
    build:
      context: apps/web
      args:
        API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
