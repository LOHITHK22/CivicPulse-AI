# Local stack: API + web. VERIFIED 2026-11-06 (Docker 27.5.1); see docs/deployment/STAGING_VERIFICATION.md.
#   docker compose up --build            -> serves the bundled real-data sample (3,785 records, smoke-scale models)
#   CIVICPULSE_DATA_DIR=/app/data docker compose up --build
#                                         -> serves your local full snapshot from ./data (read-only)
services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      CIVICPULSE_DATA_DIR: ${CIVICPULSE_DATA_DIR:-/app/sample-data}
      CIVICPULSE_API_CORS_ORIGINS: http://localhost:3000
      # AI analyst: the MCP server runs as a stdio subprocess of the API (never network-exposed).
      # Default is the deterministic fake provider; a real provider needs a server-side key in the environment.
      CIVICPULSE_LLM_PROVIDER: ${CIVICPULSE_LLM_PROVIDER:-fake}
      CIVICPULSE_LLM_MODEL: ${CIVICPULSE_LLM_MODEL:-deterministic-fake-v1}
      CIVICPULSE_OPENAI_API_KEY: ${CIVICPULSE_OPENAI_API_KEY:-}
      # Deployment controls (all optional locally; see docs/deployment/ENVIRONMENT_VARIABLES.md).
      CIVICPULSE_API_PROXY_SECRET: ${CIVICPULSE_PROXY_SECRET:-}
      CIVICPULSE_API_REQUIRE_PROXY_AUTH: ${CIVICPULSE_API_REQUIRE_PROXY_AUTH:-false}
      CIVICPULSE_AI_ACCESS_TOKEN: ${CIVICPULSE_AI_ACCESS_TOKEN:-}
      CIVICPULSE_ARTIFACT_URL: ${CIVICPULSE_ARTIFACT_URL:-}
      CIVICPULSE_ARTIFACT_SHA256: ${CIVICPULSE_ARTIFACT_SHA256:-}
      CIVICPULSE_DUCKDB_MEMORY_LIMIT: ${CIVICPULSE_DUCKDB_MEMORY_LIMIT:-}
      CIVICPULSE_DUCKDB_THREADS: ${CIVICPULSE_DUCKDB_THREADS:-}
    volumes:
      - ./data:/app/data:ro
    # Not published to the host: the browser reaches the API only through the web service.
    expose:
      - "8000"
  web:
    build:
      context: apps/web
    environment:
      # Server-side only: read by the app/api route handlers, never sent to the browser.
      API_BASE_URL: http://api:8000
      CIVICPULSE_PROXY_SECRET: ${CIVICPULSE_PROXY_SECRET:-}
      CIVICPULSE_AI_ACCESS_TOKEN: ${CIVICPULSE_AI_ACCESS_TOKEN:-}
      CIVICPULSE_CLIENT_IP_HEADER: ${CIVICPULSE_CLIENT_IP_HEADER:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
