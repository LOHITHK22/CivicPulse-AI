name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Default run excludes `live` tests (no network dependency). Uses the committed real sample.
      - run: pytest --cov=civicpulse_ingestion --cov=civicpulse_analytics --cov=civicpulse_api --cov-report=term

  web:
    name: Web types, lint, build, E2E
    runs-on: ubuntu-latest
    env:
      CIVICPULSE_DATA_DIR: ${{ github.workspace }}/.sample-data
      API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e .
      - name: Build warehouse from committed real-data sample
        run: python scripts/build_sample_warehouse.py --data-dir .sample-data
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npx tsc --noEmit
      - working-directory: apps/web
        run: npx eslint .
      - working-directory: apps/web
        run: npx next build
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright (starts API + web against the sample warehouse)
        working-directory: apps/web
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
